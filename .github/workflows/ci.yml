name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ''
      SENTRY_ENVIRONMENT: ci
      PORT: 4000
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Download deps
        run: pnpm i

      - name: 🧪 Run test script
        run: pnpm test
